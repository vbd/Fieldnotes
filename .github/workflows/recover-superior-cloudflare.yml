name: Restore verified Superior Worker version
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: superior-command-center-production
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore last verified version without modifying D1 or credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const root='https://api.cloudflare.com/client/v4/accounts/c917ac1c9a3824a210d0fb77e5879329/workers/scripts/superior-command-center';
          const version='90f42d83-2bf5-46bb-bc51-7f4efc9de5ee';
          async function api(path,body){
            const r=await fetch(root+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});
            const data=await r.json();
            if(!r.ok||!data.success)throw Error('Worker recovery API failed: HTTP '+r.status);
            return data.result;
          }
          const previous=await api('/versions/'+version);
          const bindings=previous.resources?.bindings||[];
          for(const name of ['OWNER_PASSWORD','SESSION_SECRET','DB']){
            const b=bindings.find(b=>b.name===name);
            console.log(name+': '+(b?'present in recovery version':'missing in recovery version'));
            if(!b)throw Error('Verified version is missing a required binding; recovery stopped.');
            if(name==='DB'&&b.id!=='4feb6f63-1102-467a-87e6-256309364f12')throw Error('Recovery database binding does not match; stopped.');
          }
          await api('/deployments',{strategy:'percentage',versions:[{version_id:version,percentage:100}]});
          console.log('Restored last verified Worker version. No D1 writes or secret updates were performed.');
          JS
      - name: Verify restored live D1 and owner protection
        working-directory: cloudflare-command-center
        run: |
          echo 'https://superior-command-center.superiormandr.workers.dev' > "$RUNNER_TEMP/restored-url.log"
          node scripts/verify-deployment.mjs "$RUNNER_TEMP/restored-url.log"
