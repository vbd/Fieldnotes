name: Check Cloudflare secret scope
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-cloudflare-secret-scope.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository:
    name: Check repository secret format
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check credential format without revealing contents
        run: node cloudflare-command-center/scripts/validate-cloudflare-token.mjs
  environment:
    name: Check existing environment secret format
    environment: CLOUDFLARE_API_TOKEN
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check credential format without revealing contents
        run: node cloudflare-command-center/scripts/validate-cloudflare-token.mjs
