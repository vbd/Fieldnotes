name: Identify deployment token metadata
on:
  push:
    branches: [main]
    paths: ['.github/workflows/identify-deployment-token.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read token identifier and dates without revealing its value
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          async function get(path){
            try{
              const response=await fetch('https://api.cloudflare.com/client/v4'+path,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(15000)});
              return {status:response.status,data:await response.json()};
            }catch{return {status:0,data:{}};}
          }
          const verify=await get('/user/tokens/verify');
          if(verify.status!==200||verify.data.success!==true)throw Error('Cannot verify deployment token identity.');
          const id=verify.data.result?.id;
          if(!/^[a-f0-9]{32}$/i.test(id))throw Error('Token identifier metadata is unavailable.');
          console.log('Non-secret token identifier: '+id);
          const metadata=await get('/user/tokens/'+id);
          console.log('Token metadata access HTTP status: '+metadata.status);
          if(metadata.status===200&&metadata.data.success===true){
            for(const field of ['issued_on','created_on','modified_on','last_used_on']){
              const value=metadata.data.result?.[field];
              if(typeof value==='string'&&/^\d{4}-\d\d-\d\dT[0-9:.+-]+Z?$/.test(value))console.log(field+': '+value);
            }
          }
          JS
