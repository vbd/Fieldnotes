name: Deploy Superior Command Center to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-command-center/**'
      - 'superior-owner-website/**'
      - '.github/workflows/deploy-superior-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superior-command-center-production
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test Command Center
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build public assets
        run: npm run build
      - name: Test Worker, persistent invoices, imports, and credential validation
        run: npm test
      - name: Test mobile dashboard and customer workflow
        run: npm run test:browser
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Save mobile preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superior-command-center-mobile-preview
          path: cloudflare-command-center/test-results/*.png
          if-no-files-found: ignore

  deploy:
    name: Deploy and verify Cloudflare
    needs: verify
    if: github.ref == 'refs/heads/main'
    environment: CLOUDFLARE_API_TOKEN
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-command-center
        shell: bash
    # The existing environment secret takes precedence over a repository secret of the same name.
    env:
      CLOUDFLARE_ACCOUNT_ID: c917ac1c9a3824a210d0fb77e5879329
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate environment Cloudflare secret without displaying it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/validate-cloudflare-token.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Command Center public assets
        run: npm run build
      - name: Apply additive D1 migrations without replacing records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply superior-command-center --remote
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/superior-deploy.log"
      - name: Verify live website, owner access protection, and D1 readiness
        id: live
        run: node scripts/verify-deployment.mjs "$RUNNER_TEMP/superior-deploy.log"

