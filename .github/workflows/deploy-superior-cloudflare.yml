name: Deploy Superior Command Center to Cloudflare
# Redeploy current verified code without modifying database records.

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-command-center/**'
      - 'superior-owner-website/**'
      - '.github/workflows/deploy-superior-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superior-command-center-production
  cancel-in-progress: false

# Serialize production writes, but discard obsolete runs before deployment.

jobs:
  verify:
    name: Build and test Command Center
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build public assets
        run: npm run build
      - name: Test Worker, persistent invoices, imports, and credential validation
        run: npm test
      - name: Test mobile dashboard and customer workflow
        run: npm run test:browser
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Save mobile preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superior-command-center-mobile-preview
          path: cloudflare-command-center/test-results/*.png
          if-no-files-found: ignore

  deploy:
    name: Deploy and verify Cloudflare
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-command-center
        shell: bash
    environment: CLOUDFLARE_API_TOKEN
    # Environment-level Cloudflare credential is used for deployment; the repository credential is currently not a valid token.
    env:
      CLOUDFLARE_ACCOUNT_ID: c917ac1c9a3824a210d0fb77e5879329
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate environment Cloudflare secret without displaying it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/validate-cloudflare-token.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Command Center public assets
        run: npm run build
      - name: Check required Worker settings without displaying values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/inspect-worker-settings.mjs
      - name: Apply additive D1 migrations without replacing records
        id: migration
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply superior-command-center --remote
      - name: Report D1 migration authorization result
        if: steps.migration.outcome == 'failure'
        run: |
          echo '::warning title=D1 migration blocked::Cloudflare denied direct D1 access. Attempting Worker deployment without changing database records; live readiness must still pass.'
          echo 'Cloudflare denied D1 migration. No database records were modified by this step. Worker deployment and live readiness checks will still run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm this is still the latest production commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)
          test "$latest" = "$GITHUB_SHA" || { echo "::error::Superseded deployment; run the workflow on current main."; exit 1; }
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/superior-deploy.log"
      - name: Verify live website, owner access protection, and D1 readiness
        id: live
        run: node scripts/verify-deployment.mjs "$RUNNER_TEMP/superior-deploy.log"

      - name: Report OneDrive readiness without exposing credentials or customer records
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/inspect-onedrive-readiness.mjs
