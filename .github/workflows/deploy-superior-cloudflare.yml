name: Deploy Superior Command Center to Cloudflare
on:
  push:
    branches:
      - cloudflare-d1-migration
    paths:
      - 'cloudflare-command-center/**'
      - 'superior-owner-website/**'
      - '.github/workflows/deploy-superior-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    defaults:
      run:
        working-directory: cloudflare-command-center
    env:
      CLOUDFLARE_ACCOUNT_ID: c917ac1c9a3824a210d0fb77e5879329
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect missing Cloudflare credential configuration
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for endpoint in actions/secrets environments/CLOUDFLARE_API_TOKEN/secrets actions/variables environments/CLOUDFLARE_API_TOKEN/variables; do
            echo "Configuration names in $endpoint:"
            if ! gh api "repos/$GH_REPO/$endpoint" --jq '(.secrets // .variables // [])[] | .name'; then
              echo "::notice::Configuration metadata is unavailable to the workflow token."
            fi
          done
      - name: Verify Cloudflare authorization
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured as a GitHub Actions secret."
            exit 1
          fi
      - name: Install dependencies
        run: npm install
      - name: Build Command Center public assets
        run: npm run build
      - name: Apply non-destructive D1 schema migrations
        run: npx wrangler d1 migrations apply superior-command-center --remote
      - name: Deploy Worker and static assets
        run: npx wrangler deploy
