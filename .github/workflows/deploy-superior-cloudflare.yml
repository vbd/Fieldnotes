name: Deploy Superior Command Center to Cloudflare
on:
  push:
    branches:
      - main
      - cloudflare-d1-migration
    paths:
      - 'cloudflare-command-center/**'
      - 'superior-owner-website/**'
      - '.github/workflows/deploy-superior-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    defaults:
      run:
        working-directory: cloudflare-command-center
    env:
      CLOUDFLARE_ACCOUNT_ID: c917ac1c9a3824a210d0fb77e5879329
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare authorization
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing Cloudflare deployment secret::CLOUDFLARE_API_TOKEN is unavailable. Check the secret named CLOUDFLARE_API_TOKEN in the CLOUDFLARE_API_TOKEN Actions environment."
            echo "Check the `CLOUDFLARE_API_TOKEN` secret in the `CLOUDFLARE_API_TOKEN` [deployment environment](https://github.com/${{ github.repository }}/settings/environments)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$CLOUDFLARE_API_TOKEN" = "CLOUDFLARE_API_TOKEN" ] || [ "$CLOUDFLARE_API_TOKEN" = "CLOUDFLARE_API_UNDERSCORE_TOKEN" ]; then
            echo "::error title=Invalid Cloudflare secret value::The saved secret contains a setting name instead of an API token. Replace its value with the actual API token copied from Cloudflare."
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" =~ [[:space:]] ]]; then
            echo "::error title=Invalid Cloudflare secret value::The saved token contains whitespace. Save only the raw API token, without a command, header, quotes, or extra spaces."
            exit 1
          fi
      - name: Normalize Cloudflare API token
        run: |
          python3 - <<'PY'
          import os
          import sys
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          if token.lower().startswith("bearer "):
              token = token[7:].strip()
          if len(token) > 1 and token[0] in ("'", '"') and token[-1] == token[0]:
              token = token[1:-1].strip()
          if not token or any(ord(ch) < 33 or ord(ch) > 126 for ch in token) or any(ch in token for ch in ("'", '"', "\\", ":")):
              print("::error title=Invalid Cloudflare token format::The GitHub Actions secret must contain only a raw Cloudflare API token, not an entire curl command or Authorization header.")
              sys.exit(1)
          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              print(f"CLOUDFLARE_API_TOKEN={token}", file=env)
          PY
      - name: Install dependencies
        run: npm install
      - name: Build Command Center public assets
        run: npm run build
      - name: Apply non-destructive D1 schema migrations
        run: npx wrangler d1 migrations apply superior-command-center --remote
      - name: Deploy Worker and static assets
        run: npx wrangler deploy
