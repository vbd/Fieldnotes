name: Deploy Superior Command Center to Cloudflare
on:
  push:
    branches:
      - cloudflare-d1-migration
    paths:
      - 'cloudflare-command-center/**'
      - 'superior-owner-website/**'
      - '.github/workflows/deploy-superior-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    defaults:
      run:
        working-directory: cloudflare-command-center
    env:
      CLOUDFLARE_ACCOUNT_ID: c917ac1c9a3824a210d0fb77e5879329
      SUPERIOR_DEPLOY_TOKEN: ${{ secrets.SUPERIOR_CLOUDFLARE_TOKEN }}
      PRIMARY_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FALLBACK_CLOUDFLARE_TOKEN: ${{ secrets.CLODAPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build Command Center public assets
        run: npm run build
      - name: Select active Cloudflare credential without disclosing its value
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const candidates = [
            ['SUPERIOR_CLOUDFLARE_TOKEN', process.env.SUPERIOR_DEPLOY_TOKEN],
            ['CLOUDFLARE_API_TOKEN', process.env.PRIMARY_CLOUDFLARE_TOKEN],
            ['CLODAPI_TOKEN', process.env.FALLBACK_CLOUDFLARE_TOKEN],
          ];
          function normalize(raw) {
            let token = (raw || '').trim();
            if (/^Bearer\s+/i.test(token)) token = token.replace(/^Bearer\s+/i, '').trim();
            if ((token.startsWith('"') && token.endsWith('"')) ||
                (token.startsWith("'") && token.endsWith("'"))) {
              token = token.slice(1, -1).trim();
            }
            return token;
          }
          for (const [name, raw] of candidates) {
            const token = normalize(raw);
            if (!token || token.length < 16 || /\s/.test(token)) continue;
            let result;
            try {
              const response = await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify', {
                headers: { Authorization: 'Bearer ' + token },
                signal: AbortSignal.timeout(15000)
              });
              result = response.ok ? await response.json() : null;
            } catch {
              continue;
            }
            if (result?.success === true && result?.result?.status === 'active') {
              console.log('::add-mask::' + token);
              appendFileSync(process.env.GITHUB_ENV, 'CLOUDFLARE_API_TOKEN=' + token + '\n');
              console.log('Selected active Cloudflare credential from ' + name + ' (value hidden).');
              process.exit(0);
            }
          }
          console.error('::error title=No active Cloudflare credential::No configured GitHub secret provides an active Cloudflare API token. The Secret value must be the raw token, not the secret name. No token was modified.');
          process.exit(1);
          NODE
      - name: Verify Cloudflare authorization
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing Cloudflare deployment secret::CLOUDFLARE_API_TOKEN is unavailable. Add a secret with this name to the CLOUDFLARE_API_TOKEN deployment environment or the repository Actions secrets."
            echo "Configure the CLOUDFLARE_API_TOKEN secret in [GitHub Actions secrets](https://github.com/${{ github.repository }}/settings/secrets/actions) or the selected [deployment environment](https://github.com/${{ github.repository }}/settings/environments)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$CLOUDFLARE_API_TOKEN" = "CLOUDFLARE_API_TOKEN" ] || [ "$CLOUDFLARE_API_TOKEN" = "CLOUDFLARE_API_UNDERSCORE_TOKEN" ]; then
            echo "::error title=Invalid Cloudflare secret value::The saved secret contains a setting name instead of an API token. Replace its value with the actual API token copied from Cloudflare."
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" =~ [[:space:]] ]]; then
            echo "::error title=Invalid Cloudflare secret value::The saved token contains whitespace. Save only the raw API token, without a command, header, quotes, or extra spaces."
            exit 1
          fi
      - name: Apply non-destructive D1 schema migrations
        run: npx wrangler d1 migrations apply superior-command-center --remote
      - name: Deploy Worker and static assets
        run: npx wrangler deploy
