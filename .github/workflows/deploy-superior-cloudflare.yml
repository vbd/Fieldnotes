name: Deploy Superior Command Center to Cloudflare
on:
  push:
    branches:
      - cloudflare-d1-migration
    paths:
      - 'cloudflare-command-center/**'
      - 'superior-owner-website/**'
      - '.github/workflows/deploy-superior-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    defaults:
      run:
        working-directory: cloudflare-command-center
    env:
      CLOUDFLARE_ACCOUNT_ID: c917ac1c9a3824a210d0fb77e5879329
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare authorization
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing Cloudflare deployment secret::CLOUDFLARE_API_TOKEN is unavailable. Add a secret with this name to the CLOUDFLARE_API_TOKEN deployment environment or the repository Actions secrets."
            echo "Configure the CLOUDFLARE_API_TOKEN secret in [GitHub Actions secrets](https://github.com/${{ github.repository }}/settings/secrets/actions) or the selected [deployment environment](https://github.com/${{ github.repository }}/settings/environments)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$CLOUDFLARE_API_TOKEN" = "CLOUDFLARE_API_TOKEN" ] || [ "$CLOUDFLARE_API_TOKEN" = "CLOUDFLARE_API_UNDERSCORE_TOKEN" ]; then
            echo "::error title=Invalid Cloudflare secret value::The saved secret contains a setting name instead of an API token. Replace its value with the actual API token copied from Cloudflare."
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" =~ [[:space:]] ]]; then
            echo "::error title=Invalid Cloudflare secret value::The saved token contains whitespace. Save only the raw API token, without a command, header, quotes, or extra spaces."
            exit 1
          fi
      - name: Install dependencies
        run: npm install
      - name: Build Command Center public assets
        run: npm run build
      - name: Apply non-destructive D1 schema migrations
        run: npx wrangler d1 migrations apply superior-command-center --remote
      - name: Deploy Worker and static assets
        run: npx wrangler deploy
