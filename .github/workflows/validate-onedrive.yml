name: Validate OneDrive integration
on:
  push:
    branches: [feature/onedrive-backup-integration]
    paths:
      - 'cloudflare-command-center/**'
      - '.github/workflows/validate-onedrive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npx wrangler deploy --dry-run
