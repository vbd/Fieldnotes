name: Diagnose Cloudflare account access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-cloudflare-account.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check account and database metadata without displaying credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const account='c917ac1c9a3824a210d0fb77e5879329';
          const database='4feb6f63-1102-467a-87e6-256309364f12';
          const token=process.env.CLOUDFLARE_API_TOKEN;
          async function api(path){
            try{
              const response=await fetch('https://api.cloudflare.com/client/v4'+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(15000)});
              const data=await response.json();
              return {ok:response.ok&&data.success!==false,status:response.status,data,codes:(data.errors||[]).map(e=>e.code).filter(Number.isInteger)};
            }catch{return {ok:false,status:0,data:{},codes:[]};}
          }
          function report(label,result){console.log(label+': '+(result.ok?'allowed':'denied')+'; HTTP '+result.status+'; codes '+result.codes.join(','));}
          const verify=await api('/user/tokens/verify');report('User token verification',verify);
          if(verify.ok)console.log('Token active: '+(verify.data.result?.status==='active'));
          const workers=await api('/accounts/'+account+'/workers/scripts');report('Configured account Workers access',workers);
          if(workers.ok)console.log('Expected Worker exists: '+Boolean(workers.data.result?.some(w=>w.id==='superior-command-center')));
          const db=await api('/accounts/'+account+'/d1/database/'+database);report('Configured D1 database access',db);
          const accountList=await api('/accounts?per_page=50');report('Account metadata listing',accountList);
          const candidates=Array.isArray(accountList.data.result)?accountList.data.result:[];
          for(const candidate of candidates.slice(0,20)){
            if(!/^[a-f0-9]{32}$/i.test(candidate.id))continue;
            console.log('Accessible account ID: '+candidate.id);
            const result=await api('/accounts/'+candidate.id+'/d1/database?per_page=100');report('D1 listing for '+candidate.id,result);
            if(result.ok&&Array.isArray(result.data.result)){
              for(const item of result.data.result){
                const uuid=item.uuid||item.id;
                if(item.name==='superior-command-center'&&/^[a-f0-9-]{36}$/i.test(uuid)){
                  console.log('Matching Command Center database: account='+candidate.id+' database='+uuid);
                }
              }
            }
          }
          JS
