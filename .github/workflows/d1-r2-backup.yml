name: D1 to R2 daily backup
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Backup D1 into R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: bash scripts/backup-d1-to-r2.sh
